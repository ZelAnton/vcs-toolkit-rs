[workspace]
resolver = "3"
members = [
    "crates/diff",
    "crates/cli-support",
    "crates/git",
    "crates/jj",
    "crates/github",
    "crates/gitlab",
    "crates/gitea",
    "crates/forge",
    "crates/core",
    "crates/testkit",
    "crates/watch",
    "crates/mcp",
]
# `fuzz/` is a cargo-fuzz crate (nightly + libFuzzer); excluded so it never
# touches the stable build, MSRV, or the CI gate. Run it manually — see
# fuzz/README.md.
exclude = ["fuzz"]

# Metadata shared by every crate in the toolkit. Each crate inherits these via
# `field.workspace = true` in its own Cargo.toml. NOTE: `version` is *not* here
# on purpose — the workspace crates publish independently and carry their own
# version (see each crate's [package]).
[workspace.package]
edition = "2024"
# Minimum supported Rust: edition 2024 needs 1.85, but the wrappers use
# let-chains (stabilised in 1.88), so 1.88 is the real floor. Declared here (and
# inherited via `rust-version.workspace = true`) so the contract is machine-checked
# — `cargo build` on an older toolchain fails early with a clear message.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ZelAnton/vcs-toolkit-rs"
homepage = "https://github.com/ZelAnton/vcs-toolkit-rs"
# Note: `documentation` is intentionally NOT set at workspace level. Each published crate
# relies on crates.io/docs.rs auto-linking to its own per-crate documentation page,
# avoiding the fragility of maintaining explicit per-crate documentation URLs that could
# drift from the crate's actual published name.
authors = ["Anton Zhelezniakou"]

# ---------------------------------------------------------------------------
# Workspace dependencies
#
# Convention (see CONTRIBUTING.md "Dependency management"): this workspace
# fixes NO allow-list of crates. Declare a dependency here once and reference
# it from a member with `<crate>.workspace = true` when more than one crate
# needs it.
# Give every entry an inline comment explaining *why* it's here. Pin major
# versions, enable only the features used, and keep Cargo.lock committed.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# External job-backed process launcher (Windows Job Object / Linux cgroup v2, so a
# git/jj/gh subprocess tree dies on close), with the `CliClient` core, the
# `cli_client!` macro, structured `Error`, and the `ScriptedRunner`/`RecordingRunner`
# test seams the wrappers build on (under `processkit::testing`). Was the internal
# `vcs-process` crate; now the published `processkit`. Pin `"3.1"`: the 3.x line is
# semver-stable, so the caret spans future 3.x releases and `cargo update` pulls them
# safely; it carries forward everything the 2.x pin was kept for (the `Error`
# constructors `Error::spawn`/`not_found`/`stdin`/`parse`, the Windows
# process-group/PATHEXT fixes, stdin validation, bounded output buffers, stdin-retry
# and stderr draining, and the stale Windows CTRL_BREAK-leader cleanup), which matter
# because the wrappers resolve and launch user-installed CLIs while `vcs-watch`
# manages job-object/process-group lifecycles. What 3.0 breaks, and how this
# workspace answers it:
#   * `Error` is now an opaque struct wrapping a boxed `ErrorReason` (the former enum,
#     variants and fields unchanged). Reads still go through the accessors
#     (`program()`, `code()`, `stdout()`/`stderr()`, `is_timeout()`, …); variant
#     matching moved to `err.reason()` / `err.into_reason()`, and coarse classification
#     to the flat `err.kind() -> ErrorKind`. Both `ErrorReason` and `ErrorKind` are
#     re-exported from every wrapper crate that re-exports `Error`, so downstream users
#     keep the ability to classify a failure through our surface.
#   * The output-event stream was renamed with no deprecated aliases
#     (`output_events()`→`events()`, `OutputEvent`→`ProcessEvent`,
#     `OutputEvents`→`ProcessEvents`) and now has to be joined via its `finish()`
#     finisher; verified by rg that this workspace drives no such stream and names none
#     of those items.
#   * Output-limit accounting switched from decoded line-content bytes to raw bytes read
#     from the pipe. This workspace does set byte caps — `vcs_cli_support::OutputBudget`
#     projects onto `OutputBufferPolicy::max_bytes`. Audited site by site (T-130), the
#     effect splits by stream, and the split is what `OutputBudget::bytes`' doc now
#     states: the RAW-stdout capture every content verb reads through
#     (`run_untrimmed` -> `output_bytes`) was counted in raw pipe bytes before 3.0 as
#     well — `pump_raw_bytes`/`push_capped_bytes` are byte-identical between 2.3.2 and
#     3.0.0 — so no content ceiling (the 64 KiB test caps, the MCP `--max-output-bytes`
#     default) moved; the LINE-pumped streams, i.e. a content verb's stderr under the
#     same fail-loud policy, now charge every line terminator, so a cap set against the
#     old unit trips one byte per line earlier there. Both boundaries are pinned by
#     `vcs_cli_support`'s `content_budget_*` tests. The drop-oldest diagnostic
#     projection (`clone`/`fetch`, `gh run watch`) is unaffected either way: drop-mode
#     retention is still bounded by decoded line-content bytes.
#   * `OverflowMode::DropNewest` now keeps a true contiguous prefix. Not applicable: this
#     workspace never selects that mode — `OutputBudget` projects only onto `Error`
#     (content) and `DropOldest` (the default of `unbounded()`/`bounded()`, diagnostics);
#     rg finds no `DropNewest` at all, and the only two `with_overflow` calls both select
#     `Error`. The content path also refuses a truncated capture outright rather than
#     parsing a partial one, so no parser here can depend on how a head is retained.
#   * Windows ConPTY launches now clear inherited standard handles. Not applicable: the
#     fix lives behind processkit's non-default `pty` feature, which no crate here
#     enables (only `mock`, `tracing`, `record` are), and nothing in this workspace calls
#     `use_pty`/`pty_size`/`resize_pty` — every child is spawned on the ordinary piped
#     backend, so no capture or parsing path can depend on the old handle behaviour.
#   * 3.1 adds an output-inactivity watchdog. `vcs-github` applies it only to
#     `gh run watch`: the command normally refreshes its table every ~3 seconds, so a
#     five-minute quiet period detects a stalled watcher without bounding legitimate
#     multi-hour CI. The other new 3.1 controls (CPU affinity and named-pipe readiness)
#     are intentionally left opt-in for callers: VCS wrappers must not impose scheduler
#     policy or assume that a command is a local Windows service.
processkit = "3.1"

# Auto-generated Mock*Api (git, jj, github, gitlab, gitea) for consumers' async-trait tests.
# Unified version: 0.15 satisfies both wrapper crate requirements (was 0.13) and processkit/mock needs.
mockall = "0.15"

# Statistical benchmarking harness for the large, pure parser fixtures in vcs-diff,
# vcs-git, and vcs-jj. Dev-only: benchmark binaries are never published dependencies.
criterion = "0.8"

# ---------------------------------------------------------------------------
# Workspace lints — inherited by every crate via `[lints] workspace = true`.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
# Teach the compiler the `docsrs` cfg: docs.rs (and our nightly doc build) pass
# `--cfg docsrs` via each crate's `rustdoc-args` to switch on the `#[doc(cfg(...))]`
# "Available on crate feature `x`" badges; without this, `cfg(docsrs)` would warn
# as an unexpected cfg under `-D warnings`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
